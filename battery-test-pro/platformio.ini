; Battery-life tester for the LilyGo T-Display-S3 Pro (NOT the plain T-Display S3).
; Standalone project -- unrelated to the Torch Bearer bridge firmware one folder up.
[platformio]
default_envs = pro-v1_1
boards_dir = boards

[env]
platform = espressif32@6.3.0
board = t-display-s3-pro
framework = arduino
board_build.partitions = default_16MB.csv
; No USB-CDC at boot: with it on, Serial can stall when no computer is attached,
; which would skew (or stop) a run on battery.
build_flags =
    -UARDUINO_USB_CDC_ON_BOOT
    -DDISABLE_ALL_LIBRARY_WARNINGS
lib_deps =
    lewisxhe/SensorLib @ 0.2.2
    lewisxhe/XPowersLib @ 0.2.1
    moononournation/GFX Library for Arduino @ 1.3.7

; Board revision V1.1 (constant-current backlight, 16 steps) -- the current one.
[env:pro-v1_1]

; Board revision V1.0 (PWM backlight). Only use if your board is a V1.0.
[env:pro-v1_0]
build_flags =
    ${env.build_flags}
    -DUSING_DISPLAY_PRO_V1
