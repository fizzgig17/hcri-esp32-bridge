; Torch Bearer scanner for the LilyGo T-Display S3 (env tdisplay-s3) and the T-Display-S3 Pro (env tdisplay-s3-pro)
[env:tdisplay-s3]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; T-Display-S3 Pro: same sources, BOARD_PRO selects the SPI screen, the SY6970 power chip and the battery indicator.
[env:tdisplay-s3-pro]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags = -DBOARD_PRO=1
