; Torch Bearer scanner for the LilyGo T-Display S3 (env tdisplay-s3) and the T-Display-S3 Pro (env tdisplay-s3-pro)
;
; The plain T-Display S3 is the default: a bare `pio run` / Build / Upload (VS Code's PlatformIO buttons) builds and
; flashes only tdisplay-s3. The Pro needs `-e tdisplay-s3-pro` (the GitHub workflows name both envs explicitly).
[platformio]
default_envs = tdisplay-s3

; Every env stamps the firmware with its git commit (shown on the screen as "FW <commit>"); see tools/fw_version.py.
[env]
build_flags = !python tools/fw_version.py
; Two app slots for firmware updates from the phone over Bluetooth (see partitions_ota.csv). Moving to this table needs one
; USB flash of the full factory image; after that the phone can update the board.
board_build.partitions = partitions_ota.csv

[env:tdisplay-s3]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; T-Display-S3 Pro: same sources, BOARD_PRO selects the SPI screen, the SY6970 power chip and the battery indicator.
[env:tdisplay-s3-pro]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DBOARD_PRO=1

; ColorMunki identify tool (T-Display-S3 Pro only): same sources, but app_main shows the USB IDs, strings and endpoints of
; whatever is plugged into the USB-C port instead of running the Torch Bearer bridge. Published by colormunki-probe.yml.
[env:colormunki-probe-pro]
platform = espressif32@^6.9.0
board = lilygo-t-display-s3
framework = espidf
monitor_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DBOARD_PRO=1
    -DCOLORMUNKI_PROBE=1
